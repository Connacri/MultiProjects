name: kenzy
description: "A new Hospital DZ project."
publish_to: 'none'

version: 2.0.0-rc.1+218

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.2
  cloud_firestore: ^6.1.2
  firebase_messaging: ^16.1.1
  firebase_database: ^12.1.2
  firebase_storage: ^13.0.6

  # Supabase
  supabase_flutter: ^2.16.0

  # State
  provider: ^6.1.5+1

  # UI
  font_awesome_flutter: ^11.0.0
  google_fonts: ^8.0.0
  lottie: ^3.5.1
  flutter_slidable: ^4.0.1
  fluttertoast: ^9.0.0
  percent_indicator: ^4.2.5
  fl_chart: ^1.2.0
  flutter_osm_plugin: ^2.0.0+1
  pretty_qr_code: ^3.5.0
  cached_network_image: ^3.4.1
  marqueer: ^2.5.0
  country_flags: ^4.1.0
  syncfusion_flutter_barcodes: ^34.1.32
  syncfusion_flutter_calendar: ^34.1.32
  flutter_card_swiper: ^7.0.2
  smooth_page_indicator: ^2.0.1

  # Navigation
  go_router: ^17.3.0
  map_launcher: ^4.6.0
  url_launcher: ^6.3.2

  # Local storage
  objectbox: ^5.3.2
  objectbox_flutter_libs: ^5.3.2
  shared_preferences: ^2.5.5
  path_provider: ^2.1.5

  # Networking
  http: ^1.6.0
  connectivity_plus: ^7.0.0
  network_info_plus: ^7.0.0
  multicast_dns: ^0.3.3+1

  # Image & media
  image_picker: ^1.2.3
  flutter_image_compress: ^2.5.1
  mobile_scanner: ^7.4.0
  video_player: ^2.9.2
  youtube_player_flutter: ^9.1.3

  # Auth
  google_sign_in: ^7.2.0

  # Location & Maps
  geocoding: ^5.0.0
  geolocator: any
  flutter_map: ^5.0.0
  latlong2: any

  # PDF
  pdf: ^3.11.3
  printing: ^5.14.2

  # Device
  device_info_plus: any
  permission_handler: any
  file_picker: ^11.0.2
  share_plus: any
  window_manager: any
  google_mobile_ads: any

  # Utils
  intl: ^0.20.2
  pincode_input_fields: any
  video_compress: any
  call_log: any
  path: ^1.9.1
  uuid: ^4.5.2
  faker: ^2.2.0
  timeago: ^3.7.1
  string_extensions: ^0.8.4
  dart_date: ^1.5.3
  email_validator: ^3.0.0
  cryptography: ^2.9.0
  csv: ^8.0.0
  collection: ^1.19.1
  readmore: ^3.0.0

  # Scroll
  scrollable_positioned_list: any

  # Windows platform
  msix: ^3.16.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  objectbox_generator: ^5.3.2
  build_runner: ^2.15.1
  innosetup: ^0.1.3

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/logo_hopital.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/logo_hopital.png"
    adaptive_icon_foreground: "assets/images/logo_hopital.png"
    background_color: "#hexcode"
    theme_color: "#hexcode"
  windows:
    generate: true
    image_path: "assets/images/logo_hopital.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/images/logo_hopital.png"

flutter_native_splash:
  android: true
  background_image: assets/icon/splash3.png
  android_12:
    image: assets/icon/splash3.png
    icon_background_color: "#FFFFFF"
  ios: true
  image: assets/icon/splash3.png
  color: "#FFFFFF"

flutter:
  uses-material-design: true
  generate: true

  fonts:
    - family: Oswald
      fonts:
        - asset: assets/fonts/Oswald-Bold.ttf
        - asset: assets/fonts/Oswald-ExtraLight.ttf
        - asset: assets/fonts/Oswald-SemiBold.ttf
        - asset: assets/fonts/Oswald-Regular.ttf
        - asset: assets/fonts/Oswald-Light.ttf
        - asset: assets/fonts/Oswald-Medium.ttf
    - family: ArbFONTS
      fonts:
        - asset: assets/fonts/ArbFONTS-khalaad-al-arabeh.ttf
        - asset: assets/fonts/ArbFONTS-Al-Jazeera-Arabic-Bold.ttf
        - asset: assets/fonts/ArbFONTS-Al-Jazeera-Arabic-Bold-1.ttf
        - asset: assets/fonts/ArbFONTS-Al-Jazeera-Arabic-Light.ttf
        - asset: assets/fonts/ArbFONTS-Al-Jazeera-Arabic-Regular.ttf
        - asset: assets/fonts/NizarBBCKurdish-Bold.ttf

  assets:
    - assets/
    - assets/100.png
    - assets/101.png
    - assets/star.png
    - assets/location.png
    - assets/heart.png
    - assets/lotties/
    - assets/qrcode/
    - assets/images/ic_launcher/1024.png
    - assets/images/744878.png
    - assets/images/icon.png
    - assets/firebase_logo.png
    - assets/google_logo.png
    - assets/logos/
    - assets/icon/icon.png
    - assets/logos/djezzy.png
    - assets/logos/inconnu.png
    - assets/logos/mobilis.png
    - assets/logos/ooredoo.png
    - assets/splash_logo.png
    - assets/seasons/
    - assets/photos/
    - assets/images/logo_hopital.png
    - assets/photos/hopital/
    - assets/photos/hopital/d (1).jpg
    - assets/photos/hopital/m1 (5).jpg
    - assets/photos/hopital/tt (7).jpg
    - assets/lotties/1 (2).json
    - webHospital/img/logo_hopital.png
    - webHospital/img/screenshot1.png
    - webHospital/img/screenshot2.png
    - webHospital/img/screenshot3.png
    - assets/photos/hopital/pitol/

flutter_localizations:
  sdk: flutter

intl: any
gen-l10n:
  enabled: true
  arb-dir: lib/l10n
  template-arb-file: app_en.arb
  output-localization-file: app_localizations.dart
  output-class: AppLocalizations

  flutter_gen:
    integrations:
      flutter_svg: true
      flare_flutter: true
      rive: true
      lottie: true

  flutter_intl:
    enabled: true
    class_name: S
    main_locale: en
    arb_dir: lib/l10n
    output_dir: lib/generated/intl
