name: kenzy
description: "A new Hospital DZ project."
publish_to: 'none'

version: 2.0.0-rc.1+279

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  cloud_firestore: ^6.7.1
  firebase_messaging: ^16.4.3
  firebase_database: ^12.4.6
  firebase_storage: ^13.4.5

  # Supabase
  supabase_flutter: ^2.16.0  # already latest

  # State
  provider: ^6.1.5+1

  # UI
  font_awesome_flutter: ^11.0.0
  google_fonts: ^8.2.0
  lottie: ^3.5.1
  flutter_slidable: ^4.0.3
  fluttertoast: ^9.0.0
  percent_indicator: ^4.2.5
  fl_chart: ^1.2.0
  flutter_osm_plugin: ^2.0.0+1
  pretty_qr_code: ^3.6.0
  cached_network_image: ^3.4.1
  marqueer: ^2.5.0
  country_flags: ^4.1.0
  syncfusion_flutter_barcodes: ^34.1.32
  syncfusion_flutter_calendar: ^34.1.32
  flutter_card_swiper: ^7.0.2
  smooth_page_indicator: ^2.0.1

  # Navigation
  go_router: ^17.3.0
  map_launcher: ^5.0.1
  url_launcher: ^6.3.2

  # Local storage
  objectbox: ^5.3.2
  objectbox_flutter_libs: ^5.3.2
  shared_preferences: ^2.5.5
  path_provider: ^2.1.6

  # Networking
  http: ^1.6.0
  connectivity_plus: ^7.3.1
  network_info_plus: ^7.0.0  # ⚠️ Bloqué à 7.x : >=8.1.0 requiert win32 ^6.x, incompatible avec file_picker 11.x (win32 ^5.x)
  multicast_dns: ^0.3.3+1

  # Image & media
  image_picker: ^1.2.3
  flutter_image_compress: ^2.5.1
  mobile_scanner: ^7.4.0
  video_player: ^2.9.2
  youtube_player_flutter: ^10.0.1

  # Auth
  google_sign_in: ^7.2.0

  # Location & Maps
  geocoding: ^5.0.0
  geolocator: ^14.0.2  # ⚠️ Bloqué à 14.0.2 : >=14.0.3 requiert package_info_plus ^10 → win32 ^6.x, incompatible avec file_picker 11.x
  flutter_map: ^5.0.0  # ⚠️ v8.3.1 disponible - migration des layers requise (TileLayerOptions -> TileLayer)
  latlong2: ^0.9.1  # ⚠️ Bloqué à 0.9.x : flutter_map 5.0.0 requiert latlong2 ^0.9.0 (^0.10.x nécessite flutter_map v7+)

  # PDF
  pdf: ^3.12.0
  printing: ^5.15.0

  # Device
  device_info_plus: ^12.4.0  # ⚠️ Bloqué à 12.x : >=13.1.0 requiert win32 ^6.x, incompatible avec file_picker 11.x (win32 ^5.x)
  permission_handler: ^12.0.1
  file_picker: ^11.0.2
  share_plus: ^12.0.2  # ⚠️ Bloqué à 12.x : share_plus >=13.1.0 requiert win32 ^6.x, incompatible avec file_picker 11.x (win32 ^5.x)
  window_manager: ^0.5.2
  google_mobile_ads: ^9.0.0

  # Utils
  intl: ^0.20.2  # ⚠️ Épinglé par flutter_localizations SDK à 0.20.2 exactement
  pinput: ^5.0.0  # Remplace pincode_input_fields (déprécié/non maintenu)
  video_compress: ^3.1.4
  call_log: ^6.0.1
  path: ^1.9.1
  uuid: ^4.6.0
  faker: ^2.2.0
  timeago: ^3.7.1
  string_extensions: ^0.8.4
  dart_date: ^1.5.3
  email_validator: ^3.0.0
  cryptography: ^2.9.0
  csv: ^8.0.0
  collection: ^1.19.1
  readmore: ^3.0.0

  # Scroll
  scrollable_positioned_list: ^0.3.8

  # Windows platform
  msix: ^3.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  objectbox_generator: ^5.3.2
  build_runner: ^2.15.1  # ⚠️ Bloqué à 2.15.1 : objectbox_generator 5.3.2 requiert analyzer <11.0.0 (incompatible avec build_runner >=2.15.2)
  innosetup: ^0.1.3
  flutter_native_splash: ^2.4.5
  flutter_lints: ^6.0.0

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/logo.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icon/logo.png"
    adaptive_icon_foreground: "assets/icon/logo.png"
    background_color: "#FFFFFF"
    theme_color: "#FFFFFF"
  windows:
    generate: true
    image_path: "assets/icon/logo.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/icon/logo.png"

flutter_native_splash:
  android: true
  ios: true
  background_image: assets/icon/splash.png
  android_12:
    image: assets/icon/splash.png
    icon_background_color: "#FFFFFF"
  color: "#FFFFFF"

flutter:
  uses-material-design: true
  generate: true

  fonts:
    - family: Oswald
      fonts:
        - asset: assets/fonts/Oswald-Bold.ttf
        - asset: assets/fonts/Oswald-ExtraLight.ttf
        - asset: assets/fonts/Oswald-SemiBold.ttf
        - asset: assets/fonts/Oswald-Regular.ttf
        - asset: assets/fonts/Oswald-Light.ttf
        - asset: assets/fonts/Oswald-Medium.ttf
    - family: ArbFONTS
      fonts:
        - asset: assets/fonts/ArbFONTS-khalaad-al-arabeh.ttf
        - asset: assets/fonts/ArbFONTS-Al-Jazeera-Arabic-Bold.ttf
        - asset: assets/fonts/ArbFONTS-Al-Jazeera-Arabic-Bold-1.ttf
        - asset: assets/fonts/ArbFONTS-Al-Jazeera-Arabic-Light.ttf
        - asset: assets/fonts/ArbFONTS-Al-Jazeera-Arabic-Regular.ttf
        - asset: assets/fonts/NizarBBCKurdish-Bold.ttf

  assets:
    - assets/
    - assets/100.png
    - assets/101.png
    - assets/star.png
    - assets/location.png
    - assets/heart.png
    - assets/lotties/
    - assets/qrcode/
    - assets/images/ic_launcher/1024.png
    - assets/images/744878.png
    - assets/images/icon.png
    - assets/firebase_logo.png
    - assets/google_logo.png
    - assets/logos/
    - assets/icon/icon.png
    - assets/logos/djezzy.png
    - assets/logos/inconnu.png
    - assets/logos/mobilis.png
    - assets/logos/ooredoo.png
    - assets/splash_logo.png
    - assets/seasons/
    - assets/photos/
    - assets/images/logo_hopital.png
    - assets/photos/hopital/
    - assets/photos/hopital/d (1).jpg
    - assets/photos/hopital/m1 (5).jpg
    - assets/photos/hopital/tt (7).jpg
    - assets/lotties/1 (2).json
    - webHospital/img/logo_hopital.png
    - webHospital/img/screenshot1.png
    - webHospital/img/screenshot2.png
    - webHospital/img/screenshot3.png
    - assets/photos/hopital/pitol/

flutter_localizations:
  sdk: flutter

intl: any
gen-l10n:
  enabled: true
  arb-dir: lib/l10n
  template-arb-file: app_en.arb
  output-localization-file: app_localizations.dart
  output-class: AppLocalizations

  flutter_gen:
    integrations:
      flutter_svg: true
      flare_flutter: true
      rive: true
      lottie: true

  flutter_intl:
    enabled: true
    class_name: S
    main_locale: en
    arb_dir: lib/l10n
    output_dir: lib/generated/intl
